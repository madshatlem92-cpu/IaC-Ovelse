name: Prod Deploy

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Azure login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Load Key Vault secrets (PROD)
      run: |
        RG_NAME=$(az keyvault secret show --vault-name "mads-iac-kv" --name "prod-rg" --query value -o tsv)
        LOCATION=$(az keyvault secret show --vault-name "mads-iac-kv" --name "prod-location" --query value -o tsv)
        ENVIRONMENT=$(az keyvault secret show --vault-name "mads-iac-kv" --name "prod-env" --query value -o tsv)

        echo "TF_VAR_resource_group_name=$RG_NAME" >> $GITHUB_ENV
        echo "TF_VAR_location=$LOCATION" >> $GITHUB_ENV
        echo "TF_VAR_environment=$ENVIRONMENT" >> $GITHUB_ENV

    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5

    - name: Terraform init
      run: terraform init

    - name: Terraform plan
      run: terraform plan

    # Apply kjører KUN når PR er merget til main
    - name: Terraform apply (only on push to main)
      if: github.event_name == 'push'
      run: terraform apply -auto-approve
