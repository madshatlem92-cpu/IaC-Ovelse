name: Terraform Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - prod

env:
  ARM_USE_OIDC: true
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest

    # Environment styres av branch
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Fetch secrets from Key Vault
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG_NAME=$(az keyvault secret show --vault-name "mads-iac-kv" --name "rg-name" --query value -o tsv)
            LOCATION=$(az keyvault secret show --vault-name "mads-iac-kv" --name "location" --query value -o tsv)

            echo "TF_VAR_rg_name=$RG_NAME" >> $GITHUB_ENV
            echo "TF_VAR_location=$LOCATION" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/rg
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform/rg
        run: terraform plan

      - name: Terraform Apply
        if: github.ref_name == 'dev'
        working-directory: ./terraform/rg
        run: terraform apply -auto-approve

      - name: Terraform Apply (prod)
        if: github.ref_name == 'prod' && github.event_name == 'pull_request'
        working-directory: ./terraform/rg
        run: terraform apply -auto-approve
